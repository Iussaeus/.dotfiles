bind f display-popup -E "$HOME/.dotfiles/stow/tmux-sessionizer/.local/bin/tmux-sessionizer"

# kill current session and switch to last
bind X run-shell "tmp_attached=\$(tmux list-sessions | awk -F: '/attached/{print \$1}'); tmp_last=\$(tmux list-sessions | awk -F: '!/attached/{print \$1}' | head -n 1); [ \"\$(tmux ls | wc -l)\" -gt 1 ] && tmux switch-client -t \"\$tmp_last\" && tmux kill-session -t \"\$tmp_attached\" || tmux kill-server"
bind C-x confirm-before -p "Kill tmux server? (y/n)" kill-server

set -g status-left-length 300
set -g status-justify absolute-centre
set -g renumber-windows on
